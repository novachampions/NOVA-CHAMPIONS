<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NOVA CHAMPIONS">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/nova-champions-logo.png">
<title>NOVA CHAMPIONS OFFICIAL</title>
<style>
:root{--bg:#09090b;--panel:#151518;--gold:#d8b45a;--muted:#aaa;--line:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f3ea;font-family:Arial,sans-serif}
header{padding:22px 16px;background:linear-gradient(135deg,#171717,#080808);border-bottom:1px solid #80652d;text-align:center}
.logo{font-size:12px;letter-spacing:4px;color:var(--gold)}h1{margin:8px 0;color:var(--gold);font-size:25px}header p{margin:0;color:#bbb;font-size:12px}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#101012;position:sticky;top:0;z-index:2}
button,select,input{font:inherit}nav button,.btn{border:1px solid #6e5728;background:#1a1915;color:var(--gold);border-radius:10px;padding:10px 12px;white-space:nowrap}
nav button.active,.btn.primary{background:var(--gold);color:#111;border-color:var(--gold);font-weight:bold}
main{padding:14px;max-width:760px;margin:auto}.hero{border:1px solid #765e2c;border-radius:16px;padding:18px;background:radial-gradient(circle at top,#302719,#151515 65%);text-align:center}
.hero strong{font-size:19px;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{display:block;color:var(--gold);font-size:21px;margin-bottom:4px}
h2{color:var(--gold);font-size:18px;margin:18px 2px 10px}.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card h3{margin:0 0 7px;font-size:15px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #292929}.row:last-child{border:0}
input,select,textarea{width:100%;background:#0d0d0f;color:white;border:1px solid #48413a;border-radius:9px;padding:11px;margin:5px 0 10px}textarea{min-height:76px;resize:vertical}
label{font-size:13px;color:#ccc}.form{background:var(--panel);padding:14px;border:1px solid var(--line);border-radius:13px;margin:10px 0}
.small{font-size:11px;color:#aaa}.pill{font-size:11px;color:#111;background:var(--gold);border-radius:20px;padding:4px 8px}
.standings-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;padding:14px 15px;border:1px solid #5d4b29;border-radius:15px;background:linear-gradient(120deg,#211d14,#151518 68%)}
.standings-head strong{display:block;color:var(--gold);font-size:16px;margin-bottom:5px}.standings-head .muted{font-size:12px}
.standings-scroll{overflow-x:auto;border:1px solid #38332a;border-radius:14px;background:linear-gradient(160deg,#171719,#101012);box-shadow:0 8px 24px #0005;overscroll-behavior-x:contain}
.standings-table{width:100%;min-width:610px;border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
.standings-table th{padding:13px 8px;color:#d8c18b;background:#242016;font-size:11px;white-space:nowrap;border-bottom:1px solid #66532c}
.standings-table td{padding:12px 8px;text-align:center;border-bottom:1px solid #29292c;color:#e8e5dc;white-space:nowrap}
.standings-table tbody tr{background:#171719;transition:background .15s}.standings-table tbody tr:nth-child(even){background:#1b1b1e}.standings-table tbody tr:hover{background:#28251e}.standings-table tbody tr:last-child td{border-bottom:0}
.standings-table .rank-cell{width:48px}.rank-badge{display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;border-radius:9px;background:#29292d;color:#c8c4ba;font-weight:800}
.rank-badge.gold{background:linear-gradient(145deg,#f4d77e,#b88b32);color:#211807}.rank-badge.silver{background:linear-gradient(145deg,#e5e7eb,#9299a4);color:#17191d}.rank-badge.bronze{background:linear-gradient(145deg,#d99a67,#87502d);color:#1c1009}
.standings-table .team-cell{text-align:start;min-width:145px;font-weight:700;color:#fff}.team-mark{display:inline-flex;width:29px;height:29px;margin-inline-end:8px;vertical-align:middle;align-items:center;justify-content:center;border-radius:9px;border:1px solid #65532e;background:#292317;color:var(--gold);font-size:11px;font-weight:800}
.standings-table .points-cell{color:#f2cf72;font-weight:900;font-size:14px}.standings-table .gd-positive{color:#8ed3a2}.standings-table .gd-negative{color:#ef9999}
.standings-note{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;color:#b9b5aa;font-size:11px}.standings-note span{display:inline-flex;align-items:center;gap:6px}.standings-note i{width:8px;height:8px;border-radius:50%;background:#d8b45a;display:inline-block}.competition-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.competition-tab{border:1px solid #51452e;background:#19191c;color:#d7d2c5;border-radius:12px;padding:12px 8px;font-weight:800;cursor:pointer}.competition-tab.active{background:linear-gradient(135deg,#5b4824,#2b2418);border-color:#d4ad54;color:#ffe09a;box-shadow:0 5px 16px #0005}.competition-subhead{margin:14px 0 8px;color:var(--gold);font-weight:800}.stage-card{border:1px solid #39342b;background:#171719;border-radius:13px;padding:12px;margin:9px 0}.stage-match{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid #2b2b2e}.stage-match:last-child{border-bottom:0}.stage-score{color:var(--gold);font-weight:900;white-space:nowrap}.cup-bracket{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 14px;align-items:stretch}.cup-round{flex:0 0 min(250px,78vw);min-width:min(250px,78vw);border:1px solid #4a3d25;border-radius:13px;background:#121214;padding:10px}.cup-round-title{color:var(--gold);font-weight:900;text-align:center;margin:2px 0 10px}.cup-tie{border:1px solid #39342b;border-radius:10px;background:#1a1a1d;padding:9px;margin:10px 0}.cup-side{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 2px;font-size:13px}.cup-side+ .cup-side{border-top:1px solid #303034}.cup-side.winner{color:#f3d47e;font-weight:900}.cup-side small{color:#aaa;font-weight:700}.cup-aggregate{font-size:11px;color:#aaa;text-align:center;padding-top:6px}.cup-bye{border:1px dashed #6b572e;border-radius:9px;padding:8px;margin:8px 0;color:#d8c18b;font-size:12px}@media(max-width:420px){.competition-tab{font-size:12px;padding:10px 3px}}
@media(max-width:520px){.standings-head{padding:12px}.standings-table{min-width:590px}.standings-table th,.standings-table td{padding:10px 7px}}
.actions{display:flex;gap:7px;flex-wrap:wrap}.danger{border-color:#8b3939;color:#ff9999;background:#241313}
footer{text-align:center;color:#777;padding:25px;font-size:11px}
.hidden{display:none!important}.round-tabs{display:flex;gap:7px;overflow-x:auto;padding:6px 0;margin:8px 0}.round-tabs button{min-width:76px}.match-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.match-score{color:var(--gold);font-weight:bold;font-size:18px;white-space:nowrap}.leg-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.leg-tabs button.active{background:var(--gold);color:#111;font-weight:bold}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.admin-tile{background:linear-gradient(145deg,#211d14,#151518);border:1px solid #70592c;border-radius:13px;padding:13px}.admin-tile b{display:block;color:var(--gold);font-size:23px;margin-top:5px}.admin-section{margin:14px 0}.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn.sm{padding:7px 9px;font-size:12px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.admin-note{border-inline-start:3px solid var(--gold);padding:8px 10px;background:#17150f;border-radius:7px;color:#ddd;font-size:12px;margin:10px 0}@media(min-width:600px){main{max-width:900px}.admin-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* NOVA CHAMPIONS official newspaper */
.news-masthead{background:#f4f0e6;color:#171717;border:1px solid #c7b98f;padding:15px 14px;margin:10px 0 16px;box-shadow:0 5px 18px #0005;text-align:center}
.news-kicker{font-size:10px;letter-spacing:3px;color:#78602e;font-weight:900}.news-masthead h2{font-family:Georgia,serif;color:#151515;font-size:clamp(27px,7vw,42px);letter-spacing:1px;margin:7px 0 2px}.news-masthead p{color:#5e584b;margin:4px 0;font-size:11px}.news-rule{height:3px;background:#171717;margin:10px 0 3px;border-top:1px solid #171717;border-bottom:1px solid #171717}
.news-lead{background:#f4f0e6;color:#181818;border-radius:3px;overflow:hidden;border:1px solid #c6b98e;margin:12px 0 16px}.news-lead img{width:100%;height:230px;object-fit:cover;display:block}.news-lead-copy{padding:14px}.news-category{display:inline-block;background:#b08b3d;color:#111;padding:4px 8px;font-size:10px;font-weight:900;letter-spacing:.5px}.news-lead h3{font-family:Georgia,serif;font-size:23px;line-height:1.35;margin:9px 0;color:#171717}.news-meta{font-size:11px;color:#746b59;border-bottom:1px solid #d6cdb8;padding-bottom:8px}.news-excerpt{font-size:13px;line-height:1.8;color:#37332b}.news-read{background:#171717;color:#f4e5b9;border:0;padding:9px 13px;border-radius:2px;font-weight:bold}
.news-section-title{display:flex;align-items:center;gap:10px;color:#e4c777;font-weight:900;margin:18px 0 10px}.news-section-title:after{content:'';height:1px;background:#64502a;flex:1}.news-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.news-card{background:#f4f0e6;color:#171717;border:1px solid #c6b98e;overflow:hidden;border-radius:3px}.news-card img{width:100%;height:125px;object-fit:cover;display:block}.news-card-copy{padding:10px}.news-card h3{font-family:Georgia,serif;font-size:15px;line-height:1.4;margin:7px 0;color:#171717}.news-card .news-meta{font-size:10px}.news-card p{font-size:11px;line-height:1.6;color:#514a3c}.news-article{background:#f4f0e6;color:#1b1b1b;padding:15px;border:1px solid #c6b98e;border-radius:3px}.news-article h1{font-family:Georgia,serif;color:#171717;font-size:25px;line-height:1.4}.news-article img{width:100%;max-height:360px;object-fit:cover;margin:12px 0}.news-article-body{white-space:pre-wrap;font-size:15px;line-height:2;color:#29251e}.news-admin-item{display:flex;gap:10px;align-items:center}.news-admin-item img{width:74px;height:60px;object-fit:cover;border-radius:5px}.news-upload-note{font-size:11px;color:#b9ae94;margin-top:-5px}@media(min-width:620px){.news-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.news-lead{display:grid;grid-template-columns:1.1fr 1fr;direction:ltr}.news-lead-copy{direction:rtl}.news-lead img{height:100%;min-height:270px}.news-card img{height:150px}}

#nova-splash-screen{position:fixed;inset:0;z-index:99999;background:#05070c url('assets/nova-splash.png') center center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:28px 18px;opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}
#nova-splash-screen:after{content:'BY HOUSSNI';font-weight:900;letter-spacing:4px;color:#f1d17b;text-shadow:0 2px 14px #000; padding:8px 16px;border:1px solid #d8b45a;border-radius:30px;background:#08090dcc;margin-bottom:12px}
#nova-splash-screen.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
@media(prefers-reduced-motion:reduce){#nova-splash-screen{transition:none}}
.team-link{background:transparent;border:0;color:var(--gold);font-weight:bold;padding:3px;white-space:normal;text-decoration:underline;cursor:pointer}

async function persist(){
  localStorage.novaDB=JSON.stringify(db);
  if(!isAdmin) return;
  try {
    const batch=cloud.batch();
    db.leagues.forEach(l=>{const id=String(l.id);batch.set(cloud.collection("leagues").doc(id),{...l,id:l.id,teams:l.teams||[]});});
    db.matches.forEach(m=>{const id=String(m.id || (m.id="M"+Date.now()+Math.random().toString(16).slice(2)));batch.set(cloud.collection("matches").doc(id),m);});
    (db.teams||[]).forEach(team=>{const id=String(team.id);batch.set(cloud.collection("teams").doc(id),team);});
    await batch.commit(); syncError="";
  } catch(e){syncError=e.message||"Firestore write failed";alert("Firebase: "+syncError);}
}
function startCloudSync(){
  if(unsubLeagues) unsubLeagues(); if(unsubMatches) unsubMatches(); if(unsubTeams) unsubTeams(); if(unsubArticles) unsubArticles(); if(unsubPredictions) unsubPredictions();
  unsubLeagues=cloud.collection("leagues").onSnapshot(snap=>{db.leagues=snap.docs.map(d=>d.data());cloudReady=true;localStorage.novaDB=JSON.stringify(db);migrateLegacyTeams();render();},e=>{syncError=e.message;render();});
  unsubMatches=cloud.collection("matches").onSnapshot(snap=>{db.matches=snap.docs.map(d=>d.data());cloudReady=true;localStorage.novaDB=JSON.stringify(db);render();},e=>{syncError=e.message;render();});
  unsubTeams=cloud.collection("teams").onSnapshot(snap=>{db.teams=snap.docs.map(d=>({...d.data(),id:d.data().id||d.id})).filter(x=>x.name);cloudReady=true;localStorage.novaDB=JSON.stringify(db);migrateLegacyTeams();render();},e=>{syncError=e.message;render();});
  unsubArticles=cloud.collection("articles").onSnapshot(snap=>{articles=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.publishedAt||0)-(a.publishedAt||0));render();},e=>{syncError=e.message;render();});
  unsubPredictions=cloud.collection("predictions").onSnapshot(snap=>{predictions=snap.docs.map(d=>({...d.data(),id:d.id}));render();},e=>{syncError=e.message;render();});
}
auth.onAuthStateChanged(async user=>{
  currentUser=user; isAdmin=false;
  if(user){
    adminCheck={state:"checking",uid:user.uid,path:"admins/"+user.uid,exists:null,role:"—",error:""};
    render();
    try {
      // Force a server read so an old local cache cannot mislead the admin check.
      const adminDoc=await cloud.collection("admins").doc(user.uid).get({source:"server"});
      const data=adminDoc.exists ? adminDoc.data() : null;
      adminCheck={state:adminDoc.exists && data && data.role==="admin" ? "authorized":"not_authorized",uid:user.uid,path:"admins/"+user.uid,exists:adminDoc.exists,role:data && data.role!==undefined ? String(data.role):"(missing)",error:""};
      isAdmin=adminCheck.state==="authorized";
      if(isAdmin)migrateLegacyTeams();
      // Keep the session active when the document is missing, so diagnostics remain visible.
    } catch(e) {
      adminCheck={state:"read_error",uid:user.uid,path:"admins/"+user.uid,exists:null,role:"—",error:(e.code?e.code+" — ":"")+e.message};
      isAdmin=false;
    }
  } else {
    adminCheck={state:"signed_out",uid:"",path:"admins/—",exists:null,role:"—",error:""};
  }
  render();
});

function teamStats(name){const out={fans:0,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0};const master=(db.teams||[]).find(x=>x.name===name);out.fans=Number(master?.fans||0);const counted=db.matches.filter(m=>(m.h===name||m.a===name)&&m.hs!==null&&m.as!==null&&Number.isFinite(Number(m.hs))&&Number.isFinite(Number(m.as)));const cupGroups=new Map();counted.filter(m=>m.cup||String(m.id).startsWith("CUP_")).forEach(m=>{const l=db.leagues.find(x=>String(x.id)===String(m.league));const key=[String(m.league),Number(m.round)||1,...[String(m.h||""),String(m.a||"")].sort(),l?.cupFormat==="homeAway"?(m.leg||"home"):"single"].join("|");if(!cupGroups.has(key))cupGroups.set(key,m);});const nonCup=counted.filter(m=>!(m.cup||String(m.id).startsWith("CUP_")));[...nonCup,...cupGroups.values()].forEach(m=>{const home=m.h===name,forUs=Number(home?m.hs:m.as),against=Number(home?m.as:m.hs);out.p++;out.gf+=forUs;out.ga+=against;if(forUs>against){out.w++;out.pts+=3}else if(forUs<against){out.l++}else{out.d++;out.pts++;}});out.gd=out.gf-out.ga;return out;}
function registryTeamId(name){return "TEAM_"+encodeURIComponent(name).slice(0,700);}
function migrateLegacyTeams(){if(!isAdmin||legacyMigrationRunning||!db.leagues.length)return;legacyMigrationRunning=true;(async()=>{try{const names=[...new Set(db.leagues.flatMap(l=>l.teams||[]).filter(Boolean))];for(const name of names){const id=registryTeamId(name);if((db.teams||[]).some(x=>x.name===name))continue;const ref=cloud.collection("teams").doc(id),snap=await ref.get();if(!snap.exists){const team={id,name,fans:0};await ref.set(team);db.teams.push(team);}}localStorage.novaDB=JSON.stringify(db);}catch(e){syncError=e.message||String(e);}finally{legacyMigrationRunning=false;render();}})()}

async function loadAdminPlayerTeams(){
  if(!isAdmin)return;

  const box=document.getElementById("playerTeamsAdminList");
  if(!box)return;

  box.innerHTML='<p class="muted">جاري تحميل فرق اللاعبين...</p>';

  try{
    const [teamsSnap,profilesSnap,bannedSnap]=await Promise.all([
      cloud.collection("playerTeams").get(),
      cloud.collection("playerProfiles").get(),
      cloud.collection("bannedUsers").get()
    ]);

    const profiles={};
    profilesSnap.docs.forEach(d=>profiles[d.id]=d.data());

    const banned={};
    bannedSnap.docs.forEach(d=>banned[d.id]=true);

    if(!teamsSnap.size){
      box.innerHTML='<p class="muted">لا توجد فرق لاعبين حالياً</p>';
      return;
    }

    box.innerHTML=teamsSnap.docs.map(doc=>{
      const team=doc.data();
      const uid=doc.id;
      const owner=profiles[team.ownerUid]||{};
      const st=teamStats(team.name);
      const isBlocked=!!banned[uid];

      return `<div class="card">
        <h3>${esc(team.name||"")}</h3>
        <p>صاحب الفريق: ${esc(owner.name||"غير معروف")}</p>
        <p>الهاتف: ${esc(owner.phone||"—")}</p>
        <p>التقييم: ${Number(team.overall)||0} | التشكيلة: ${esc(team.formation||"—")}</p>
        <p>${isBlocked?"🔴 الحساب محظور":"🟢 الحساب نشيط"}</p>
        <div class="stats">
          <div class="stat"><b>${st.p}</b>مباريات</div>
          <div class="stat"><b>${st.w}</b>انتصارات</div>
          <div class="stat"><b>${st.d}</b>تعادلات</div>
          <div class="stat"><b>${st.l}</b>هزائم</div>
          <div class="stat"><b>${st.gf}:${st.ga}</b>الأهداف</div>
          <div class="stat"><b>${st.pts}</b>النقاط</div>
        </div>
        <button class="btn ${isBlocked?"primary":"danger"}"
          onclick="togglePlayerBan('${uid}',${isBlocked})">
          ${isBlocked?"رفع الحظر":"حظر اللاعب"}
        </button>
      </div>`;
    }).join("");

  }catch(e){
    box.innerHTML='<p class="muted">خطأ: '+esc(e.message||e)+'</p>';
  }
}

async function togglePlayerBan(uid,isBlocked){
  if(!isAdmin || !uid)return;

  const action=isBlocked?"رفع الحظر عن اللاعب":"حظر اللاعب";

  if(!confirm("واش متأكد من "+action+"؟"))return;

  try{
    const ref=cloud.collection("bannedUsers").doc(uid);

    if(isBlocked){
      await ref.delete();
      alert("تم رفع الحظر بنجاح");
    }else{
      await ref.set({
        uid:uid,
        bannedAt:Date.now()
      });
      alert("تم حظر اللاعب بنجاح");
    }

    await loadAdminPlayerTeams();

  }catch(e){
    alert("تعذر تنفيذ العملية: "+(e.message||e));
  }
}

  const round=Number(m.round)||1,teams=[String(m.h||""),String(m.a||"")].sort((a,b)=>a.localeCompare(b));

function predictionPoints(pred,m){
 if(!m||m.hs===null||m.as===null||m.hs===undefined||m.as===undefined)return 0;
 const ph=Number(pred.homeGoals),pa=Number(pred.awayGoals),rh=Number(m.hs),ra=Number(m.as);
 if(ph===rh&&pa===ra)return 3;
 const predicted=ph>pa?"h":ph<pa?"a":"d",actual=rh>ra?"h":rh<ra?"a":"d";
 return predicted===actual?1:0;
}

async function submitPrediction(encodedMatchId){
 const matchId=decodeURIComponent(encodedMatchId),m=db.matches.find(x=>String(x.id)===matchId);

 try{await cloud.collection("predictions").doc(docId).set({matchId,nickname,homeGoals:Number(home),awayGoals:Number(away),createdAt:Date.now()});alert(lang==="ar"?"تسجل التوقع بنجاح!":"Prediction submitted!");}
 catch(e){alert(e.code==="permission-denied"?(lang==="ar"?"ما قدرناش نسجلو التوقع. تأكد من قواعد Firestore وأن التوقعات مازال مفتوحة.":"Could not submit. Check Firestore rules and whether predictions are open."):(e.message||"Prediction error"));}
}

async function uploadNewsImage(file){
  const endpoint=`https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`;
  const form=new FormData();form.append('file',file);form.append('upload_preset',cloudinaryConfig.uploadPreset);
  const response=await fetch(endpoint,{method:'POST',body:form});
  const result=await response.json();
  if(!response.ok)throw new Error(result?.error?.message||'فشل رفع الصورة إلى Cloudinary.');
  if(!result.secure_url)throw new Error('Cloudinary لم يرجع رابط الصورة.');
  return {imageUrl:result.secure_url,imagePublicId:result.public_id||''};
}

async function generateSchedule(leagueId){if(!isAdmin)return;const l=db.leagues.find(x=>String(x.id)===String(leagueId));if(!l)return;if(l.mode==="cup")return generateCupSchedule(l);if(l.mode==="champions")return generateChampionsLeagueSchedule(l);const teams=(l.teams||[]).slice();if(teams.length<2)return alert(t("needTeams"));if(db.matches.some(m=>String(m.league)===String(leagueId)))return alert(t("scheduleExists"));if(!confirm(t("scheduleConfirm")))return;for(let i=teams.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[teams[i],teams[j]]=[teams[j],teams[i]];}const rotation=teams.slice();if(rotation.length%2)rotation.push(null);const totalRounds=rotation.length-1,half=rotation.length/2,fixtures=[];for(let r=0;r<totalRounds;r++){for(let i=0;i<half;i++){const a=rotation[i],b=rotation[rotation.length-1-i];if(a&&b){let home=a,away=b;if((r+i)%2){home=b;away=a;}fixtures.push({round:r+1,leg:"home",h:home,a:away});fixtures.push({round:r+1,leg:"away",h:away,a:home});}}const fixed=rotation[0],rest=rotation.slice(1);rest.unshift(rest.pop());rotation.splice(0,rotation.length,fixed,...rest);}const batch=cloud.batch(),created=[];fixtures.forEach((m,index)=>{const id="SCH_"+String(leagueId)+"_"+m.leg+"_"+m.round+"_"+index;const record={id,league:String(leagueId),h:m.h,a:m.a,hs:null,as:null,round:m.round,leg:m.leg,schedule:true};created.push(record);batch.set(cloud.collection("matches").doc(id),record);});try{await batch.commit();db.matches.push(...created);localStorage.novaDB=JSON.stringify(db);selected=String(leagueId);selectedRound=1;selectedLeg="home";render();}catch(e){alert("Firebase: "+(e.message||e));}}

async function playerLogin(){
  const email=document.getElementById("playerEmail")?.value.trim();
  const password=document.getElementById("playerPassword")?.value;
  const err=document.getElementById("playerError");
  if(!email||!password){if(err)err.textContent="دخل البريد الإلكتروني وكلمة المرور";return;}
  try{
    await auth.signInWithEmailAndPassword(email,password);
    go("player");
  }catch(e){
    if(err)err.textContent=e.message||"تعذر تسجيل الدخول";
  }
}

async function playerRegister(){
  const name=document.getElementById("regName")?.value.trim();
  const email=document.getElementById("regEmail")?.value.trim();
  const phone=document.getElementById("regPhone")?.value.trim();
  const password=document.getElementById("regPassword")?.value;
  const teamName=document.getElementById("regTeam")?.value.trim();
  const overall=Number(document.getElementById("regOverall")?.value);
  const formation=document.getElementById("regFormation")?.value;
  const err=document.getElementById("playerError");

  if(!name||!email||!phone||!password||!teamName){
    if(err)err.textContent="عمر جميع الخانات";
    return;
  }
  if(password.length<6){
    if(err)err.textContent="كلمة المرور خاصها تكون 6 أحرف على الأقل";
    return;
  }
  if(!Number.isInteger(overall)||overall<100||overall>160){
    if(err)err.textContent="التقييم خاصو يكون بين 100 و160";
    return;
  }

  try{
    if(err)err.textContent="جاري إنشاء الحساب...";
    const credential=await auth.createUserWithEmailAndPassword(email,password);
    const uid=credential.user.uid;
    const now=Date.now();

    await cloud.collection("playerProfiles").doc(uid).set({
      uid,name,phone,createdAt:now,updatedAt:now
    });

    await cloud.collection("playerTeams").doc(uid).set({
      ownerUid:uid,
      name:teamName,
      overall,
      formation,
      logoUrl:"",
      createdAt:now,
      updatedAt:now
    });

    go("player");
  }catch(e){
    if(err)err.textContent=e.message||"تعذر إنشاء الحساب";
  }
}

    err.textContent="التقييم خاصو يكون بين 100 و160";
    return;
  }

  try{
    err.textContent="جاري الحفظ...";
    const now=Date.now();
    const logoFile=document.getElementById("editPlayerLogo")?.files?.[0];
const oldTeam=(await cloud.collection("playerTeams").doc(uid).get()).data()||{};
const logoUrl=logoFile?await uploadTeamImage(logoFile):(oldTeam.logoUrl||"");

    await cloud.collection("playerProfiles").doc(uid).update({
      name,phone,updatedAt:now
    });

    await cloud.collection("playerTeams").doc(uid).update({
  name:teamName,overall,formation,logoUrl,updatedAt:now
});

    err.textContent="تم حفظ التعديلات بنجاح ❤️";
  }catch(e){
    err.textContent="تعذر الحفظ: "+(e.message||e);
  }
}

 // NOVA CHAMPIONS BACKGROUND MUSIC
const novaMusic = document.getElementById("novaMusic");
const musicToggle = document.getElementById("musicToggle");

const novaPlaylist = [
    "assets/Hayya Hayya.mp3",
    "assets/Felous Baba.mp3",
    "assets/Arhbo.mp3",
    "assets/Zombie.mp3",
    "assets/Mahboul Ana.mp3",
    "assets/Candyshop.mp3",
    "assets/Routine.mp3"
];

let currentTrack = 0;
let musicEnabled = localStorage.getItem("novaMusicEnabled") !== "false";

function updateMusicButton() {
    musicToggle.textContent = musicEnabled
        ? "🔇 إيقاف الموسيقى"
        : "🎵 تشغيل الموسيقى";
}

async function playNovaMusic() {
    if (!novaMusic || !musicEnabled) return;

    try {
        await novaMusic.play();
    } catch (error) {
        console.log("Music waiting for user interaction");
    }
}

novaMusic.addEventListener("ended", () => {
    currentTrack = (currentTrack + 1) % novaPlaylist.length;
    novaMusic.src = novaPlaylist[currentTrack];
    if (musicEnabled) playNovaMusic();
});

updateMusicButton();
novaMusic.src = novaPlaylist[currentTrack];

if (musicEnabled) {
    playNovaMusic();
}

musicToggle.addEventListener("click", async () => {
    musicEnabled = !musicEnabled;
    localStorage.setItem("novaMusicEnabled", musicEnabled);

    if (musicEnabled) {
        await playNovaMusic();
    } else {
        novaMusic.pause();
    }

    updateMusicButton();
});

document.addEventListener("pointerdown", () => {
    if (musicEnabled && novaMusic.paused) {
        playNovaMusic();
    }
}, { once: true });
  </script></body></html>
