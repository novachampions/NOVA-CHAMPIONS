async function persist(){
  localStorage.novaDB=JSON.stringify(db);
  if(!isAdmin) return;
  try {
    const batch=cloud.batch();
    db.leagues.forEach(l=>{const id=String(l.id);batch.set(cloud.collection("leagues").doc(id),{...l,id:l.id,teams:l.teams||[]});});
    db.matches.forEach(m=>{const id=String(m.id || (m.id="M"+Date.now()+Math.random().toString(16).slice(2)));batch.set(cloud.collection("matches").doc(id),m);});
    (db.teams||[]).forEach(team=>{const id=String(team.id);batch.set(cloud.collection("teams").doc(id),team);});
    await batch.commit(); syncError="";
  } catch(e){syncError=e.message||"Firestore write failed";alert("Firebase: "+syncError);}
}
function startCloudSync(){
  if(unsubLeagues) unsubLeagues(); if(unsubMatches) unsubMatches(); if(unsubTeams) unsubTeams(); if(unsubArticles) unsubArticles(); if(unsubPredictions) unsubPredictions();
  unsubLeagues=cloud.collection("leagues").onSnapshot(snap=>{db.leagues=snap.docs.map(d=>d.data());cloudReady=true;localStorage.novaDB=JSON.stringify(db);migrateLegacyTeams();render();},e=>{syncError=e.message;render();});
  unsubMatches=cloud.collection("matches").onSnapshot(snap=>{db.matches=snap.docs.map(d=>d.data());cloudReady=true;localStorage.novaDB=JSON.stringify(db);render();},e=>{syncError=e.message;render();});
  unsubTeams=cloud.collection("teams").onSnapshot(snap=>{db.teams=snap.docs.map(d=>({...d.data(),id:d.data().id||d.id})).filter(x=>x.name);cloudReady=true;localStorage.novaDB=JSON.stringify(db);migrateLegacyTeams();render();},e=>{syncError=e.message;render();});
  unsubArticles=cloud.collection("articles").onSnapshot(snap=>{articles=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.publishedAt||0)-(a.publishedAt||0));render();},e=>{syncError=e.message;render();});
  unsubPredictions=cloud.collection("predictions").onSnapshot(snap=>{predictions=snap.docs.map(d=>({...d.data(),id:d.id}));render();},e=>{syncError=e.message;render();});
}
auth.onAuthStateChanged(async user=>{
  currentUser=user; isAdmin=false;
  if(user){
    adminCheck={state:"checking",uid:user.uid,path:"admins/"+user.uid,exists:null,role:"—",error:""};
    render();
    try {
      // Force a server read so an old local cache cannot mislead the admin check.
      const adminDoc=await cloud.collection("admins").doc(user.uid).get({source:"server"});
      const data=adminDoc.exists ? adminDoc.data() : null;
      adminCheck={state:adminDoc.exists && data && data.role==="admin" ? "authorized":"not_authorized",uid:user.uid,path:"admins/"+user.uid,exists:adminDoc.exists,role:data && data.role!==undefined ? String(data.role):"(missing)",error:""};
      isAdmin=adminCheck.state==="authorized";
      if(isAdmin)migrateLegacyTeams();
      // Keep the session active when the document is missing, so diagnostics remain visible.
    } catch(e) {
      adminCheck={state:"read_error",uid:user.uid,path:"admins/"+user.uid,exists:null,role:"—",error:(e.code?e.code+" — ":"")+e.message};
      isAdmin=false;
    }
  } else {
    adminCheck={state:"signed_out",uid:"",path:"admins/—",exists:null,role:"—",error:""};
  }
  render();
});

function teamStats(name){const out={fans:0,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0};const master=(db.teams||[]).find(x=>x.name===name);out.fans=Number(master?.fans||0);const counted=db.matches.filter(m=>(m.h===name||m.a===name)&&m.hs!==null&&m.as!==null&&Number.isFinite(Number(m.hs))&&Number.isFinite(Number(m.as)));const cupGroups=new Map();counted.filter(m=>m.cup||String(m.id).startsWith("CUP_")).forEach(m=>{const l=db.leagues.find(x=>String(x.id)===String(m.league));const key=[String(m.league),Number(m.round)||1,...[String(m.h||""),String(m.a||"")].sort(),l?.cupFormat==="homeAway"?(m.leg||"home"):"single"].join("|");if(!cupGroups.has(key))cupGroups.set(key,m);});const nonCup=counted.filter(m=>!(m.cup||String(m.id).startsWith("CUP_")));[...nonCup,...cupGroups.values()].forEach(m=>{const home=m.h===name,forUs=Number(home?m.hs:m.as),against=Number(home?m.as:m.hs);out.p++;out.gf+=forUs;out.ga+=against;if(forUs>against){out.w++;out.pts+=3}else if(forUs<against){out.l++}else{out.d++;out.pts++;}});out.gd=out.gf-out.ga;return out;}
function registryTeamId(name){return "TEAM_"+encodeURIComponent(name).slice(0,700);}
function migrateLegacyTeams(){if(!isAdmin||legacyMigrationRunning||!db.leagues.length)return;legacyMigrationRunning=true;(async()=>{try{const names=[...new Set(db.leagues.flatMap(l=>l.teams||[]).filter(Boolean))];for(const name of names){const id=registryTeamId(name);if((db.teams||[]).some(x=>x.name===name))continue;const ref=cloud.collection("teams").doc(id),snap=await ref.get();if(!snap.exists){const team={id,name,fans:0};await ref.set(team);db.teams.push(team);}}localStorage.novaDB=JSON.stringify(db);}catch(e){syncError=e.message||String(e);}finally{legacyMigrationRunning=false;render();}})()}

async function loadAdminPlayerTeams(){
  if(!isAdmin)return;

  const box=document.getElementById("playerTeamsAdminList");
  if(!box)return;

  box.innerHTML='<p class="muted">جاري تحميل فرق اللاعبين...</p>';

  try{
    const [teamsSnap,profilesSnap,bannedSnap]=await Promise.all([
      cloud.collection("playerTeams").get(),
      cloud.collection("playerProfiles").get(),
      cloud.collection("bannedUsers").get()
    ]);

    const profiles={};
    profilesSnap.docs.forEach(d=>profiles[d.id]=d.data());

    const banned={};
    bannedSnap.docs.forEach(d=>banned[d.id]=true);

    if(!teamsSnap.size){
      box.innerHTML='<p class="muted">لا توجد فرق لاعبين حالياً</p>';
      return;
    }

    box.innerHTML=teamsSnap.docs.map(doc=>{
      const team=doc.data();
      const uid=doc.id;
      const owner=profiles[team.ownerUid]||{};
      const st=teamStats(team.name);
      const isBlocked=!!banned[uid];

      return `<div class="card">
        <h3>${esc(team.name||"")}</h3>
        <p>صاحب الفريق: ${esc(owner.name||"غير معروف")}</p>
        <p>الهاتف: ${esc(owner.phone||"—")}</p>
        <p>التقييم: ${Number(team.overall)||0} | التشكيلة: ${esc(team.formation||"—")}</p>
        <p>${isBlocked?"🔴 الحساب محظور":"🟢 الحساب نشيط"}</p>
        <div class="stats">
          <div class="stat"><b>${st.p}</b>مباريات</div>
          <div class="stat"><b>${st.w}</b>انتصارات</div>
          <div class="stat"><b>${st.d}</b>تعادلات</div>
          <div class="stat"><b>${st.l}</b>هزائم</div>
          <div class="stat"><b>${st.gf}:${st.ga}</b>الأهداف</div>
          <div class="stat"><b>${st.pts}</b>النقاط</div>
        </div>
        <button class="btn ${isBlocked?"primary":"danger"}"
          onclick="togglePlayerBan('${uid}',${isBlocked})">
          ${isBlocked?"رفع الحظر":"حظر اللاعب"}
        </button>
      </div>`;
    }).join("");

  }catch(e){
    box.innerHTML='<p class="muted">خطأ: '+esc(e.message||e)+'</p>';
  }
}

async function togglePlayerBan(uid,isBlocked){
  if(!isAdmin || !uid)return;

  const action=isBlocked?"رفع الحظر عن اللاعب":"حظر اللاعب";

  if(!confirm("واش متأكد من "+action+"؟"))return;

  try{
    const ref=cloud.collection("bannedUsers").doc(uid);

    if(isBlocked){
      await ref.delete();
      alert("تم رفع الحظر بنجاح");
    }else{
      await ref.set({
        uid:uid,
        bannedAt:Date.now()
      });
      alert("تم حظر اللاعب بنجاح");
    }

    await loadAdminPlayerTeams();

  }catch(e){
    alert("تعذر تنفيذ العملية: "+(e.message||e));
  }
}

  const round=Number(m.round)||1,teams=[String(m.h||""),String(m.a||"")].sort((a,b)=>a.localeCompare(b));

function predictionPoints(pred,m){
 if(!m||m.hs===null||m.as===null||m.hs===undefined||m.as===undefined)return 0;
 const ph=Number(pred.homeGoals),pa=Number(pred.awayGoals),rh=Number(m.hs),ra=Number(m.as);
 if(ph===rh&&pa===ra)return 3;
 const predicted=ph>pa?"h":ph<pa?"a":"d",actual=rh>ra?"h":rh<ra?"a":"d";
 return predicted===actual?1:0;
}

async function submitPrediction(encodedMatchId){
 const matchId=decodeURIComponent(encodedMatchId),m=db.matches.find(x=>String(x.id)===matchId);

 try{await cloud.collection("predictions").doc(docId).set({matchId,nickname,homeGoals:Number(home),awayGoals:Number(away),createdAt:Date.now()});alert(lang==="ar"?"تسجل التوقع بنجاح!":"Prediction submitted!");}
 catch(e){alert(e.code==="permission-denied"?(lang==="ar"?"ما قدرناش نسجلو التوقع. تأكد من قواعد Firestore وأن التوقعات مازال مفتوحة.":"Could not submit. Check Firestore rules and whether predictions are open."):(e.message||"Prediction error"));}
}

async function uploadNewsImage(file){
  const endpoint=`https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`;
  const form=new FormData();form.append('file',file);form.append('upload_preset',cloudinaryConfig.uploadPreset);
  const response=await fetch(endpoint,{method:'POST',body:form});
  const result=await response.json();
  if(!response.ok)throw new Error(result?.error?.message||'فشل رفع الصورة إلى Cloudinary.');
  if(!result.secure_url)throw new Error('Cloudinary لم يرجع رابط الصورة.');
  return {imageUrl:result.secure_url,imagePublicId:result.public_id||''};
}

async function generateSchedule(leagueId){if(!isAdmin)return;const l=db.leagues.find(x=>String(x.id)===String(leagueId));if(!l)return;if(l.mode==="cup")return generateCupSchedule(l);if(l.mode==="champions")return generateChampionsLeagueSchedule(l);const teams=(l.teams||[]).slice();if(teams.length<2)return alert(t("needTeams"));if(db.matches.some(m=>String(m.league)===String(leagueId)))return alert(t("scheduleExists"));if(!confirm(t("scheduleConfirm")))return;for(let i=teams.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[teams[i],teams[j]]=[teams[j],teams[i]];}const rotation=teams.slice();if(rotation.length%2)rotation.push(null);const totalRounds=rotation.length-1,half=rotation.length/2,fixtures=[];for(let r=0;r<totalRounds;r++){for(let i=0;i<half;i++){const a=rotation[i],b=rotation[rotation.length-1-i];if(a&&b){let home=a,away=b;if((r+i)%2){home=b;away=a;}fixtures.push({round:r+1,leg:"home",h:home,a:away});fixtures.push({round:r+1,leg:"away",h:away,a:home});}}const fixed=rotation[0],rest=rotation.slice(1);rest.unshift(rest.pop());rotation.splice(0,rotation.length,fixed,...rest);}const batch=cloud.batch(),created=[];fixtures.forEach((m,index)=>{const id="SCH_"+String(leagueId)+"_"+m.leg+"_"+m.round+"_"+index;const record={id,league:String(leagueId),h:m.h,a:m.a,hs:null,as:null,round:m.round,leg:m.leg,schedule:true};created.push(record);batch.set(cloud.collection("matches").doc(id),record);});try{await batch.commit();db.matches.push(...created);localStorage.novaDB=JSON.stringify(db);selected=String(leagueId);selectedRound=1;selectedLeg="home";render();}catch(e){alert("Firebase: "+(e.message||e));}}

async function playerLogin(){
  const email=document.getElementById("playerEmail")?.value.trim();
  const password=document.getElementById("playerPassword")?.value;
  const err=document.getElementById("playerError");
  if(!email||!password){if(err)err.textContent="دخل البريد الإلكتروني وكلمة المرور";return;}
  try{
    await auth.signInWithEmailAndPassword(email,password);
    go("player");
  }catch(e){
    if(err)err.textContent=e.message||"تعذر تسجيل الدخول";
  }
}

async function playerRegister(){
  const name=document.getElementById("regName")?.value.trim();
  const email=document.getElementById("regEmail")?.value.trim();
  const phone=document.getElementById("regPhone")?.value.trim();
  const password=document.getElementById("regPassword")?.value;
  const teamName=document.getElementById("regTeam")?.value.trim();
  const overall=Number(document.getElementById("regOverall")?.value);
  const formation=document.getElementById("regFormation")?.value;
  const err=document.getElementById("playerError");

  if(!name||!email||!phone||!password||!teamName){
    if(err)err.textContent="عمر جميع الخانات";
    return;
  }
  if(password.length<6){
    if(err)err.textContent="كلمة المرور خاصها تكون 6 أحرف على الأقل";
    return;
  }
  if(!Number.isInteger(overall)||overall<100||overall>160){
    if(err)err.textContent="التقييم خاصو يكون بين 100 و160";
    return;
  }

  try{
    if(err)err.textContent="جاري إنشاء الحساب...";
    const credential=await auth.createUserWithEmailAndPassword(email,password);
    const uid=credential.user.uid;
    const now=Date.now();

    await cloud.collection("playerProfiles").doc(uid).set({
      uid,name,phone,createdAt:now,updatedAt:now
    });

    await cloud.collection("playerTeams").doc(uid).set({
      ownerUid:uid,
      name:teamName,
      overall,
      formation,
      logoUrl:"",
      createdAt:now,
      updatedAt:now
    });

    go("player");
  }catch(e){
    if(err)err.textContent=e.message||"تعذر إنشاء الحساب";
  }
}

    const now=Date.now();

const oldTeam=(await cloud.collection("playerTeams").doc(uid).get()).data()||{};
const logoUrl=logoFile?await uploadTeamImage(logoFile):(oldTeam.logoUrl||"");

    await cloud.collection("playerProfiles").doc(uid).update({
      name,phone,updatedAt:now
    });

  name:teamName,overall,formation,logoUrl,updatedAt:now
});

const novaMusic = document.getElementById("novaMusic");
const musicToggle = document.getElementById("musicToggle");

const novaPlaylist = [
    encodeURI("assets/Hayya Hayya (Better Together) _ FIFA World Cup 2022TM Official Soundtrack(MP3_160K).mp3"),
    encodeURI("assets/Ahmed Saad _ DYSTINCT _ Orange - Felous Baba (Official Music Video) احمد سعد و ديستانكت - فلوس بابا(MP3_160K).mp3"),
    encodeURI("assets/Arhbo – the Ooredoo song for FIFA World Cup Qatar 2022TM in Arabic(MP3_160K).mp3"),
    encodeURI("assets/LAZARO - ZOMBIE (Official Music Video)(MP3_160K).mp3"),
    encodeURI("assets/Lazaro - MAHBOUL ANA (Official Music Video)(MP3_160K).mp3"),
    encodeURI("assets/STORMY - CANDYSHOP (VISUALIZER)(MP3_160K).mp3"),
    encodeURI("assets/STORMY_ _mcph.4m  - ROUTINE (VISUALIZER)(MP3_160K).mp3")
];

let currentTrack = 0;
let musicEnabled = localStorage.getItem("novaMusicEnabled") !== "false";

function updateMusicButton() {
    musicToggle.textContent = musicEnabled
        ? "🔇 إيقاف الموسيقى"
        : "🎵 تشغيل الموسيقى";
}

async function playNovaMusic() {
    if (!novaMusic || !musicEnabled) return;

    try {
        await novaMusic.play();
    } catch (error) {
        console.log("Music waiting for user interaction");
    }
}

novaMusic.addEventListener("ended", () => {
    currentTrack = (currentTrack + 1) % novaPlaylist.length;
    novaMusic.src = novaPlaylist[currentTrack];
    if (musicEnabled) playNovaMusic();
});

updateMusicButton();
novaMusic.src = novaPlaylist[currentTrack];

if (musicEnabled) {
    playNovaMusic();
}

musicToggle.addEventListener("click", async () => {
    musicEnabled = !musicEnabled;
    localStorage.setItem("novaMusicEnabled", musicEnabled);

    if (musicEnabled) {
        await playNovaMusic();
    } else {
        novaMusic.pause();
    }

    updateMusicButton();
});

document.addEventListener("pointerdown", () => {
    if (musicEnabled && novaMusic.paused) {
        playNovaMusic();
    }
}, { once: true });
